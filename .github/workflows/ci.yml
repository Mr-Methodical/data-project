name: Verify RinkCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  correctness-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check backend scripts
      - name: Test ingestion, reconciliation, persistence, and export
        run: python -m pytest --cov=rinkcheck --cov-report=term-missing -q
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Typecheck and production build
        run: npm run build
        working-directory: frontend
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise the complete review workflow
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: frontend/playwright-report/
          retention-days: 7
